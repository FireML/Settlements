# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:settlementlevelconf.yml

village:
  level-1:
    claim-upkeep: 500
    per-world-upkeep:
      Kingdoms_nether: 1000
    chunks: 20
    outposts: 1
