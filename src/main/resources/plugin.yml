main: me.crz.minecraft.kingdoms.KingdomsPlugin
version: "${minecraft.plugin.version}"
name: ApeironKingdoms
depend: [Vault, ApeironKingdomsEssentials]
softdepend: [LWC]
author: crz
authors: [Phoenix616]
api-version: 1.13
commands:
  plot:
    description: Plot Commands.
    aliases: [p, land]
  lock:
    description: Lock Commands.
    aliases: [protection,secure]
  unlock:
    description: Unlock a container.
    aliases: [unprotection,unsecure]
  village:
    description: Village Commands.
    aliases: [s, settlement, kingdom, k]
  empire:
    description: Empire Commands.
    aliases: [e, nation]
  villageadmin:
    description: Admin Commands.
    aliases: [va]
  resident:
    description: Shows you the name of the players village.
    aliases: [res]
  chat:
    description: Chat Channel Commands.
    aliases: [c]
  localchat:
    description: Local chat
    aliases: [local,lc]
  tradechat:
    description: Trade chat
    aliases: [trade,tc]
  generalchat:
    description: General chat
    aliases: [general,gc]
  settlementchat:
    description: Settlement chat
    aliases: [villagechat,sc,vc]
  allychat:
    description: Ally chat
    aliases: [ally,ac]
  empirechat:
    description: Empire chat
    aliases: [ec]
  adminchat:
    description: Admin chat
    aliases: [admin,adc]
  staffchat:
    description: Staff chat
    aliases: [staff,stc]
  message:
    description: Private message command
    aliases: [msg, tell, pm, m, w, t, whisper, emsg, etell, epm, ewhisper]
  reply:
    description: PM reply command
    aliases: [r]
  friend:
    aliases: [friends, f]
    description: Friending command
  ignore:
    description: Player ignore command
  scoreboard:
    description: Scoreboard command
  rainbowtag:
    description: Rainbow tag command
permissions:
  kingdoms.admin:
    description: Permission for admins. Gives access to everything.
    default: op
    children:
      kingdoms.admin.ss: true
      kingdoms.staff: true
      kingdoms.chat.colour: true
      kingdoms.channel.admin: true
  kingdoms.admin.ss:
    description: Permission to access social spy.
    default: op
  kingdoms.bypass.banish:
    description: Permission to bypass being banished from a settlement.
    default: op
  kingdoms.bypass.ignore:
    description: Permission to bypass being ignored
    default: op
  kingdoms.bypass.chatlock:
    description: Permission to bypass the chat being locked
    default: op
  kingdoms.bypass.lock:
    description: Permission to bypass locks
    default: op
  kingdoms.bypass.restriction.chestshop:
    description: Permission to bypass shop build restrictions.
    default: op
  kingdoms.bypass.restriction.lwc:
    description: Permission to bypass shop build restrictions.
    default: op
  kingdoms.staff:
    description: Permission for staffs. Gives access to some staff only functions.
    default: op
    children:
      kingdoms.user: true
      kingdoms.bypass.restriction.chestshop: true
      kingdoms.bypass.restriction.lwc: true
      kingdoms.bypass.banish: true
      kingdoms.bypass.locks: true
      kingdoms.bypass.ignore: true
      kingdoms.bypass.chatlock: true
      kingdoms.channel.staff: true
  kingdoms.user:
    description: Permission for users. Gives access to all plugin functions that a user should have.
    default: true
  kingdoms.chat.colour:
    description: Gives permission to use colours in chat
    default: op
  kingdoms.rainbowtag:
    description: Gives permission to use the rainbowtag command
    default: op