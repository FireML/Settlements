main: de.themoep.settlements.SettlementsPlugin
version: "${minecraft.plugin.version}"
name: Settlements
depend: [Vault]
softdepend: [LWC, ChestShop, Multiverse-Core, CMI, PlaceholderAPI, Brewery, PlotSquared, Citizens, Denizen]
authors: [Phoenix616, Oheers, FireML]
api-version: 1.19
commands:
  plot:
    description: Plot Commands.
    aliases: [p, land]
  portal:
    description: Portal Commands.
    aliases: [netherportal]
  lock:
    description: Lock Commands.
    aliases: [protection,secure]
  unlock:
    description: Unlock a container.
    aliases: [unprotection,unsecure]
  settlement:
    description: Settlement Commands.
    aliases: [s, village, kingdom, k, v]
  empire:
    description: Empire Commands.
    aliases: [e, nation]
  settlementadmin:
    description: Admin Commands.
    aliases: [villageadmin, va, sa, kingdomadmin, ka, empireadmin, ea]
  resident:
    description: Shows you the name of the players settlement.
    aliases: [res]
  tax:
    description: Shows tax information.
  chat:
    description: Chat Channel Commands.
    aliases: [c]
  localchat:
    description: Local chat
    aliases: [local,lc]
  tradechat:
    description: Trade chat
    aliases: [trade,tc]
  generalchat:
    description: General chat
    aliases: [general,gc,g]
  helpchat:
    description: Help chat
  eventchat:
    description: Event chat
    aliases: [event,evc]
  settlementchat:
    description: Settlement chat
    aliases: [villagechat,sc,vc]
  allychat:
    description: Ally chat
    aliases: [ally,ac]
  empirechat:
    description: Empire chat
    aliases: [ec]
  empireallychat:
    description: Empire ally chat
    aliases: [eally,eac,alliance]
  adminchat:
    description: Admin chat
    aliases: [admin,adc]
  staffchat:
    description: Staff chat
    aliases: [staff,stc]
  ccem:
    description: CCEM Chat
    aliases: [content, cc]
  message:
    description: Private message command
    aliases: [msg, tell, pm, m, w, whisper, emsg, etell, epm, ewhisper]
  reply:
    description: PM reply command
    aliases: [r]
  friend:
    aliases: [friends, f]
    description: Friending command
  ignore:
    description: Player ignore command
  msgtoggle:
    description: Toggle private messages on or off
    aliases: [messagetoggle, togglemsg, togglemessages]
  notify:
    description: Toggle mention notification sounds on or off
    aliases: [notifytoggle, togglenotify, nottoggle, notif, notiftoggle]
  scoreboard:
    description: Scoreboard command
  scoreboardadmin:
    description: Scoreboard admin command
  warningtoggle:
    description: Toggle the warning when building near settlements
    aliases: [togglewarning]
    usage: /<command> <settlement>
  towny:
    aliases: [t]
permissions:
  settlements.admin:
    description: Permission for admins. Gives access to everything.
    default: op
    children:
      settlements.admin.ss: true
      settlements.admin.command: true
      settlements.staff: true
      settlements.mod: true
      settlements.chat.colour: true
      settlements.channel.admin: true
      settlements.bypass.flyremoval: true
      settlements.admin.scoreboard: true
  settlements.admin.ss:
    description: Permission to access social spy.
    default: false
  settlements.admin.command:
    description: Permission to access the villageadmin command.
    default: false
  settlements.admin.scoreboard:
    description: Permission to access the scoreboardadmin command.
    default: false
  settlements.bypass.banish:
    description: Permission to bypass being banished from a settlement.
    default: op
  settlements.bypass.ignore:
    description: Permission to bypass being ignored
    default: op
  settlements.bypass.chatlock:
    description: Permission to bypass the chat being locked
    default: op
  settlements.bypass.lock:
    description: Permission to bypass locks
    default: op
  settlements.bypass.use:
    description: Permission to bypass claim/world use restriction
    default: op
  settlements.bypass.build:
    description: Permission to bypass claim/world build restriction
    default: op
  settlements.bypass.buildingradius:
    description: Permission to bypass claim radius building restriction
    default: op
  settlements.bypass.pvp:
    description: Permission to bypass claim/world pvp restriction
    default: op
  settlements.bypass.flyremoval:
    description: Permission to bypass the removal of flight when leaving empire worlds
    default: op
  settlements.bypass.restriction.chestshop:
    description: Permission to bypass shop build restrictions.
    default: op
  settlements.bypass.restriction.lwc:
    description: Permission to bypass shop build restrictions.
    default: op
  settlements.bypass.teleport:
    description: Permission to bypass any teleport restrictions (E.g. to empire worlds).
    default: op
  settlements.bypass.teleport-delay:
    description: Permission to bypass the teleport wait delay.
    default: op
  settlements.bypass.teleport-cooldown:
    description: Permission to bypass the teleport cooldown when the delay was bypassed.
    default: op
  settlements.prefix.staff:
    description: Show the staff prefix in private chat.
    default: op
  settlements.staff:
    description: Permission for staffs. Gives access to some staff only functions.
    default: op
    children:
      settlements.user: true
      settlements.bypass.chatlock: true
      settlements.channel.staff: true
      settlements.autojoinchannel.help: true
      settlements.prefix.staff: true
      settlements.chat.lock: true
      settlements.chat.links: true
      settlements.command.tax.others: true
  settlements.mod:
    description: Permission for mods. Gives access to bypasses to feature limitations
    default: op
    children:
      settlements.user: true
      settlements.bypass.pvp: true
      settlements.bypass.restriction.chestshop: true
      settlements.bypass.restriction.lwc: true
      settlements.bypass.banish: true
      settlements.bypass.locks: true
      settlements.bypass.use: true
      settlements.bypass.build: true
      settlements.bypass.buildingradius: true
      settlements.bypass.ignore: true
      settlements.chat.links: true
      settlements.command.tax.others: true
  settlements.user:
    description: Permission for users. Gives access to all plugin functions that a user should have.
    default: true
    children:
      settlements.command.settlement.npc: true
      settlements.command.settlement.npc.teleport: true
      settlements.command.empire.npc: true
      settlements.command.empire.npc.teleport: true
      settlements.command.settlement.claim.coords: true
      settlements.command.settlement.unclaim.coords: true
      settlements.command.empire.claim.coords: true
      settlements.command.empire.unclaim.coords: true
  settlements.command.scoreboard:
    description: Permission for toggling the scoreboard on or off. Does not hide custom scoreboards set with /scoreboardadmin!
  settlements.chat.colour:
    description: Gives permission to use colours in chat
    default: op
  settlements.chat.links:
    description: Gives permission to use links in chat
    default: op
  settlements.chat.lock:
    description: Gives permission to lock the chat
    default: op
  settlements.command.tax.others:
    description: Gives permission to see tax information of other players
    default: op