# Show some debug logging messages
debug: true
storage:
  type: mysql
  host: localhost
  port: 3306
  user: root
  database: kingdoms
  table-prefix: kingdoms_
  password: password
  url-parameters: ""
  queue:
    size: 100 # Max the queue before saving happens
    wait: 2 # Time to wait in seconds before saving queued entries
resident-cache-duration: 120 # in seconds
scoreboard:
  animation-speed: 2 # in ticks (disables if set to 0 or below)
  update: 10 # in seconds (disables scoreboard completely if set to 0 or below)
disabled-claiming-worlds: []
reset-channel-on-login: true
empire-creation-cost: 0
empire-start-balance: 0
village-creation-cost: 0
village-start-balance: 0
outpost-creation-cost: 0
empire-max-tax: 1000000
village-max-tax: -1
plot-max-tax: -1
# Time in seconds to wait before being teleported
teleport-delay:
  outpost: 3
  village: 3
  kingdom: 3
  empire: 3
# Time to wait after teleporting if user had kingdoms.bypass.teleport-delay permission
teleport-cooldown:
  outpost: 3
  village: 3
  kingdom: 3
  empire: 3
upkeep:
  empire: 1000
  hour: 0
  timezone: EST
# Days after which empty and inactive villages get deleted: (0 disables this)
village-inactive-time: 30
# How long in minutes they stay abandoned before getting deleted
abandon-time:
  village: 30
  kingdom: 30
  empire: 1440
max-village-size: 30
max-empire-size: 20
# Used for teleporting players back when they
# got into a world they shouldn't be in
spawn-command: "spawn {player}"
empires-world:
  prefix: ""
  suffix: "_Domain"
#  generator: "generatorname"
#  generator-settings: "settings"
#  seed: ""
  structures: false
  environment: normal
  type: normal
  border-radius: 500
  # Rename cooldown in seconds
  cooldown: 30
  # Amount of time a world can be regenerated after creation in seconds
  regen-duration: 3600
claim-enemy-distance: 4
close-claims-grace-days: 4
close-claims-unclaims-outposts: false
# The distance in chunks in which a settlement should get a notification when someone builds/griefs
# Set to 0 to disable
close-building-notification-distance: 4
# The time in minutes a disabled close building notification stays around
close-building-notification-toggle-time: 30
only-lock-in-settlement: true
claim-max-radius: 5
plot:
  name-length: 25
  description-length: 255
# How often (in seconds) should the plugin check for mobs
# that wandered into claims that had mob spawning disabled?
# Setting this to 0 or anything below will disable this check!
mob-flag-check-period: 30
entries-per-page: 10
players-in-show: 40
chat:
  notify:
    # Notification sound. See https://papermc.io/javadocs/1.13/org/bukkit/Sound.html
    sound: entity_experience_orb_pickup
    # Cooldown between notification sounds
    cooldown: 15
  channel-colors:
    general: white
    event: green
    local: yellow
    admin: dark_purple
    staff: gold
    help: white
    settlement: yellow
    trade: light_purple
    ally: aqua
    empireally: aqua
    empire: aqua
    private-sent: aqua
    private-received: aqua
  channel-prefix-colors:
    general: black
    event: green
    local: yellow
    admin: red
    staff: blue
    help: red
    settlement: aqua
    trade: light_purple
    ally: gold
    empireally: gold
    empire: aqua
    private-sent: dark_gray
    private-received: dark_gray
  selectable-colors:
  - blue
  - dark_blue
  - dark_green
  - dark_aqua
  - dark_red
  - dark_purple
  - gold
  - gray
  - dark_gray
  - green
  - aqua
  - red
  - light_purple
  - yellow
  - white

# Amount of titles that can be set per rank
titles-per-rank: 10
# Unclaimed/abandoned modes
modes:
  unclaimed:
    firespread: false
    explosions: false
    pvp: true
    mobspawning: true
  # Settings for worlds that have claiming disabled
  unclaimable:
    firespread: false
    explosions: false
    pvp: true
    mobspawning: true
  # Override for specific worlds
  worlds:
    Resource:
      explosions: true
  abandoned:
    village:
      firespread: false
      explosions: false
      pvp: true
      mobspawning: true
    kingdom:
      firespread: false
      explosions: false
      pvp: true
      mobspawning: true
    empire:
      firespread: false
      explosions: false
      pvp: true
      mobspawning: true
# Amount in ticks after which the chunk queue will be processed to load the locks in it
lock-load-queue-ticks: 20
remove-locks-on-unclaim: true
remove-locked-blocks: false
lockable:
- chest
- trapped_chest
- dispenser
- dropper
- furnace
- "*shulker_box"
- "*_door"
- "*_trapdoor"
- "*_fence_gate"
- "*_button"
- lever
- note_block
- jukebox
# This checks if a block is protected on place rather than using the
# InventoryMoveItemEvent to prevent hoppers from stealing items
alternative-hopper-protection: true
# Whether or not a player can transfer their bought claims to an empire
claimtransfer-to-empire: false
# Toggle Placeholder API usage in certain places
placeholder-api:
  sidebar: true
  chat:
    hover: true
    format:
      channel: true
      private: true
brewery:
  # Players with a drunkeness above that value can no longer write in the channel
  block-channels:
    local: 9001
    trade: 1
    event: 1
    general: 1
    settlement: 9001
    empire: 1
    ally: 1
    empireally: 1
    admin: 9001
    staff: 9001
chestshop:
  block-sell-below-upkeep: true
  # Cooldown in seconds for sending notifications for a certain shop
  notification-cooldown: 5