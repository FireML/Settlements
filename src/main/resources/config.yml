# For internal usage only. Do NOT touch!
config-version: 1
# Log some debug messages about the inner working of the plugin
debug: true

storage:
  type: mysql
  host: localhost
  port: 3306
  user: root
  database: kingdoms
  table-prefix: kingdoms_
  password: password
  url-parameters: ""
  queue:
    # Max size of the queue before saving happens
    size: 100
    # Time to wait in seconds before saving queued entries
    wait: 2
      
# Upkeep scheduler settings
upkeep:
  hour: 0
  timezone: UTC
  
# Amount of entries that should be shown per page in chat e.g. for command help messages
entries-per-page: 10
# How many players should show up in settlement/empire member lists
players-in-info: 40
# How long in seconds a player has time to confirm certain commands
command-confirm-time: 30
# Default modes of certain types or full worlds

cache:
  # Time in seconds which a resident's data stays in the cache
  #  even if it is not needed elsewhere
  duration-resident: 120

settlement:
  # How much a player must pay to create a settlement
  creation-cost: 1000
  # How much money a settlement starts with
  start-balance: 1000
  # Maximum size a settlement can have (0 disables the size check)
  max-size: 30
  # Maximum value that a settlement's tax can be set to. Set to -1 to disable maximum
  max-tax: -1
  # How many different titles can be configured for a rank
  titles-per-rank: 10
  upkeep:
    # The amount of minutes that a settlement will stay abandoned after not being able to pay their upkeep
    # Abandoned settlements can be raided and fully accessed but nobody can claim them
    abandon-time: 30
    # The amount of days that a settlement's chief can be offline until it gets deleted
    # Set to -1 if you don't want to delete them at all
    inactive-time: 30
  outpost:
    # How much a settlement must pay to create a new outpost
    creation-cost: 0
  claiming:
    # Worlds in which claiming of Settlement chunks are disabled
    disabled-worlds:
    - world_nether
    # Distance in chunks that have to be between claims of non-allied settlements
    enemy-distance: 4
    # Maximum radius in chunks which can be (un)claimed with the radius (un)claiming commands
    max-radius: 5
    close:
      building-notification:
        # The distance in chunks in which a settlement should get a notification when someone builds/griefs
        # Set to 0 to disable
        distance: 4
        # The time in minutes a disabled close building notification stays around
        toggle-time: 30
      unclaim:
        # How many days to wait before automatically unclaiming claims that are too close when unallying
        # Set to -1 to disable the automatic unclaiming of too close lands
        grace-days: 4
        # Whether or not outposts are unclaimed
        outposts: false

empire:
  # Whether or not a player can transfer their bought claims to an empire
  claim-transfer: false
  # How much a settlement must pay to create an empire
  creation-cost: 0
  # How much money an empire starts with
  start-balance: 0
  # Maximum value that an empire's tax can be set to. Set to -1 to disable maximum
  max-tax: 1000000
  # Maximum size an empire can have (0 disables the size check)
  max-size: 20
  # The cooldown in seconds after renaming an empire
  rename-cooldown: 30
  # How many different titles can be configured for a rank
  titles-per-rank: 10
  upkeep:
    # The amount of minutes that an empire will stay abandoned after not being able to pay their upkeep
    # Abandoned empires can be raided and fully accessed
    abandon-time: 1440
  world:
    # Whether each empire should get their own world automatically generated
    enabled: true
    # The prefix of all empire worlds. WARNING: Changing this with existing worlds will break them!
    prefix: ''
    # The suffix of all empire worlds. WARNING: Changing this with existing worlds will break them!
    suffix: _Domain
    # The environment of the world. Can be normal, nether or the_end
    environment: normal
    # The type of the world. Can be normal, flat, large_biomes or amplified
    type: normal
    # The name of the generator to use for the empire worlds. Set to empty to not use one
    generator: ''
    # The settings for the defined generator
    generator-settings: ''
    # The seed to be used for the generator. Set to empty to use a random one for each world.
    seed: ''
    # Whether or not to generate structures
    structures: false
    # The radius that an empire world will have by default
    border-radius: 500
    # Amount of seconds an empire can regenerate their world after empire generation to find one they like
    # Set to -1 to allow infinite regeneration
    regen-duration: 3600

plot:
  # Maximum value that a plot's tax can be set to. Set to -1 to disable maximum
  max-tax: -1
  # Maximum length that plot names can be (without formatting). Cannot be longer than 255.
  name-length: 25
  # Maximum length that plot descriptions can be (without formatting).
  description-length: 255
  
modes:
  # Modes in unclaimed land
  unclaimed:
    firespread: false
    explosion: false
    pvp: true
    mobspawning: true
    passivespawning: true
  unclaimable:
    firespread: false
    explosion: false
    pvp: true
    mobspawning: true
    passivespawning: true
  # Override modes in specific worlds
  worlds:
    Resource:
      explosions: true
    world_nether:
      explosions: false
  # Modes in abandoned settlements/empires
  abandoned:
    # Village-level Settlements
    village:
      firespread: false
      explosion: false
      pvp: true
      mobspawning: true
      passivespawning: true
    # Kingdom-level Settlements
    kingdom:
      firespread: false
      explosion: false
      pvp: true
      mobspawning: true
      passivespawning: true
    # Abandoned Empire worlds
    empire:
      firespread: false
      explosion: false
      pvp: true
      mobspawning: true
      passivespawning: true

lock:
  # Enable or disable the inbuilt locking
  enabled: true
  # Whether or not locks are only allowed in settlement claims and empire worlds
  only-in-claim: false
  # This checks if a block is protected by checking on hopper place
  #  rather than using the InventoryMoveItemEvent stealing of items
  alternative-hopper-protection: true
  # Amount in ticks after which the chunk queue will be processed to load the locks in it
  load-queue-ticks: 20
  # Blocks that can be locked
  blocks:
  - chest
  - trapped_chest
  - dispenser
  - dropper
  - furnace
  - '*shulker_box'
  - '*_door'
  - '*_trapdoor'
  - '*_fence_gate'
  - '*_button'
  - lever
  - note_block
  - jukebox
  unclaim:
    # Remove all locks in a chunk when it gets unclaimed
    remove: true
    # Also remove the blocks when the locks get removed on unclaim
    remove-block: false
    
portal:
  # Enable or disable the inbuilt portal handling
  enabled: true
  
teleport:
  # The command to run to teleport the player to spawn via the GUI,
  # when a player is kicked from a settlement's claim or when an Empire world is made private/removed
  # If not set it will teleport to the world spawn of the default world
  spawn-command: mv tp {player} world
  # Seconds to wait after allowing a teleport again if user has the kingdoms.bypass.teleport-delay permission
  # Set to 0 to disable
  cooldown:
    outpost: 3
    village: 3
    kingdom: 3
    empire: 3
  # The amount of time in seconds which a player needs to stand still before being teleported to an outpost/home
  # Set to 0 to instant teleport
  delay:
    outpost: 3
    village: 3
    kingdom: 3
    empire: 3
    
chat:
  notify:
    # The sound that is played when a player's name is mentioned in chat
    sound: entity_experience_orb_pickup
    # Seconds between notification sounds
    cooldown: 15
  # The default channel prefix colors
  channel-prefix-colors:
    general: black
    event: green
    local: yellow
    admin: red
    staff: blue
    help: red
    settlement: aqua
    trade: light_purple
    ally: gold
    empireally: gold
    empire: aqua
    private-sent: dark_gray
    private-received: dark_gray
  # The default chat channel colors
  channel-colors:
    general: white
    event: green
    local: yellow
    admin: dark_purple
    staff: gold
    help: white
    settlement: yellow
    trade: light_purple
    ally: aqua
    empireally: aqua
    empire: aqua
    private-sent: aqua
    private-received: aqua
  # Enable or disable the inbuilt chat
  enabled: true
  # Should this plugin only handle chat and not provide any other function?
  # Useful for cross-server chat (requires ConnectorPlugin)
  chat-only: false
  # Should all channels be set to the default config on player login or be the same as on logout
  reset-channels-on-login: true
  # The colors that players can use for chat channels
  selectable-colors:
  - blue
  - dark_blue
  - dark_green
  - dark_aqua
  - dark_red
  - dark_purple
  - gold
  - gray
  - dark_gray
  - green
  - aqua
  - red
  - light_purple
  - yellow
  - white
  # Toggle PlaceholderAPI placeholders in certain places
  placeholder-api:
    hover: true
    format:
      channel: true
      private: true

sidebar:
  # Enable or disable the inbuilt sidebar
  enabled: true
  # Seconds between scoreboard updates
  update: 1
  # Ticks for the scoreboard header animation (set to 0 to disable it)
  header-speed: 2
  # Whether PlaceholderAPI placeholders should be replaced in the sidebar
  placeholder-api: true

chestshop:
  # Whether or not it is allowed for a settlement's/empire's shop to be sold to if the owner goes below their next upkeep
  allow-selling-below-upkeep: false
  # The seconds between shop transaction notifications
  notification-cooldown: 5
  
brewery:
  # Players with a drunkeness above that value can no longer write in the channel
  block-channels:
    local: 9001
    trade: 1
    event: 1
    general: 1
    settlement: 9001
    empire: 1
    ally: 1
    empireally: 1
    admin: 9001
    staff: 9001