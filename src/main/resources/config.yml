# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:config.yml

# For internal usage only. Do NOT touch!
config-version: 3
# Log some debug messages about the inner working of the plugin
debug: false
  
# Amount of entries that should be shown per page in chat e.g. for command help messages
entries-per-page: 10
# How many players should show up in settlement member lists
players-in-info: 40
# Max lengths of the rules
# In characters
max-rules-length: 25000
# How long in seconds a player has time to confirm certain commands
command-confirm-time: 30

storage:
  type: sqlite
  host: localhost
  port: 3306
  user: user
  password: password
  database: db
  table-prefix: settlements_
  url-parameters: ""
  # MySQL connection timeout in ms
  connection-timeout: 30000
  # Should all data be saved again on shutdown? Normally modifications
  # are saved directly, this just makes sure it's all saved!
  save-on-shutdown: true
  queue:
    # Max size of the queue before saving happens
    size: 50
    # Time to wait in seconds before saving queued entries
    wait: 2
    # Queue settings for mission data
    missions:
      # Max size of the queue before saving happens
      size: 50
      # Time to wait in seconds before saving queued entries
      wait: 15
    
# Upkeep scheduler settings
upkeep:
  hour: 0
  timezone: UTC

cache:
  # Time in seconds which a resident's data stays in the cache
  #  even if it is not needed elsewhere
  duration-resident: 120


claiming:
  # Worlds in which claiming of chunks are disabled
  disabled-worlds:
  - Resource
  - Resource_nether
  - Resource_the_end
  - Spawn
  - Events
  - Mapart
  # Distance in chunks that have to be between claims of non-allied landowners
  enemy-distance: 4
  # Maximum radius in chunks which can be (un)claimed with the radius (un)claiming commands
  max-radius: 5
  # The seconds between each check for mobs to be removed in claimed land that has mobspawning turned off
  # Set to 0 to disable
  mob-flag-check-period: 10
  close:
    building:
      # The distance in chunks to other landowners in which to allow building
      # Outside of this distance building will not be allowed.
      # If a notification message is set in the messages.yml at 'close-claims'
      # then that will be sent to the player or members of the settlement.
      # Set to 0 to disable
      distance: 4
      # Whether or not to block building outside the range.
      block-outside: false
      # Whether or not to block building inside the range.
      block-inside: false
      # Which blocks are allowed to get built anyways.
      allowed-blocks:
      - "*shulker_box"
      allowed-worlds:
      - "Resource"
      - "Resource_nether"
      - "Resource_the_end"
      - "Events"
      - "Spawn"
      - "Mapart"
      # The time in minutes a disabled close building notification stays around
      toggle-time: 30
    unclaim:
      # How many days to wait before automatically unclaiming claims that are too close when unallying
      # Set to -1 to disable the automatic unclaiming of too close lands
      grace-days: 0
      # Whether or not outposts are unclaimed
      outposts: true
      
settlement:
  # How much a player must pay to create a settlement
  creation-cost: 0
  # How much money a settlement starts with
  start-balance: 0
  # Maximum size a settlement can have (0 disables the size check)
  max-size: 30
  # Maximum value that a settlement's tax can be set to. Set to -1 to disable maximum
  max-tax: 10000
  # Maximum value that a settlement's auction tax can be set to. Set to -1 to disable maximum
  max-auction-tax: 30
  # How many different titles can be configured for a rank
  titles-per-rank: 10
  # The maximum length of the settlement names
  name-length: 20
  # What regex settlement names need to match
  name-validation: "[\\w-]+"
  
  leveling:
    # The amount of levels until a settlement converts from a Village to a Kingdom
    # Set to 6 because another village level was added for the "camp" idea. - FireML
    village-max-level: 6
    #The maximum amount of Kingdom levels
    kingdom-max-level: 15

  missions:
    # Whether or not settlement missions should be given to residents
    enabled: true
    # Should newly joined residents be granted missions instantly or do they need to wait until the upkeep?
    distribute-on-join: true
    # Should additional missions be distributed when leveling up or do they need to wait until the upkeep?
    distribute-on-levelup: true
    # Allow distribution of duplicate missions?
    duplicate-missions: false
    # Should missions that are not started yet be removed and replaced by new missions on reset?
    remove-not-started-missions: true
    # Should already started missions be removed and replaced by new missions on reset?
    remove-started-missions: true
    # Should finished missions be reset? If those are not reset then the resident needs to wait for the settlement to upgrade to get more!
    remove-finished-missions: true
    # Amount to pay from a settlement's bank to distribute new missions. (Set to -1 to disable this functionality)
    redistribute-price: 5000
    # Time in minutes for which block placements should be cached so that break mission abuse isn't possible using (recent) player placed blocks.
    place-cache-time: 60
    
    claiming:
      # Worlds in which claiming of Settlement chunks are disabled
      disabled-worlds:
      - Spawn
      - Mapart
      - Resource
      - Resource_the_end
      - Resource_nether
      - Events

  outpost:
    # How much a settlement must pay to create a new outpost
    creation-cost: 0
    
  upkeep:
    # The amount of minutes that a settlement will stay abandoned after not being able to pay their upkeep
    # Abandoned settlements can be raided and fully accessed but nobody can claim them
    abandon-time: 120
    # The amount of days that a settlement can exist at level 1 before falling
    # Set to -1 if you don't want to delete them at all
    inactive-time: 7
    
plot:
  # Maximum value that a plot's tax can be set to. Set to -1 to disable maximum
  max-tax: -1
  # Maximum length that plot names can be (without formatting). Cannot be longer than 255.
  name-length: 25
  # Maximum length that plot descriptions can be (without formatting).
  description-length: 255
  
# Default modes of certain types or full worlds
modes:
  # Modes in unclaimed land
  unclaimed:
    firespread: false
    explosion: false
    pvp: true
    mobspawning: true
    passivespawning: true
  # Settings for worlds that have claiming disabled
  unclaimable:
    firespread: false
    explosion: false
    pvp: true
    mobspawning: true
    passivespawning: true
  # Override modes in specific worlds
  worlds:
    Resource:
      explosions: true
    world_nether:
      explosions: false
    world_end:
      explosions: false
  # Modes in abandoned settlements
  abandoned:
    # Village-level Settlements
    village:
      firespread: false
      explosion: false
      pvp: true
      mobspawning: true
      passivespawning: true
    # Kingdom-level Settlements
    kingdom:
      firespread: false
      explosion: false
      pvp: true
      mobspawning: true
      passivespawning: true
  
teleport:
  # The command to run to teleport the player to spawn via the GUI or
  # when a player is kicked from a settlement's claim
  # If not set it will teleport to the world spawn of the default world
  spawn-command: ""
  
  # The amount of time in seconds which a player needs to stand still before being teleported to an outpost/home
  # Set to 0 to instant teleport
  delay:
    outpost: 3
    village: 3
    kingdom: 3
    plotsquared: 3
  
  # Seconds to wait after allowing a teleport again if user has the kingdoms.bypass.teleport-delay permission
  # Set to 0 to disable
  cooldown:
    outpost: 3
    village: 3
    kingdom: 3
    plotsquared: 3
