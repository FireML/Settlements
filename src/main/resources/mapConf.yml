# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:mapconf.yml

color:
  # Claims of your own settlement
  own: GREEN
  # Plots owned by you
  own-plot: YELLOW
  # Plots linked to your own plot
  own-plot-linked: GOLD
  # Plots linked to the plot you are standing in
  own-plot-linked-current: BLUE
  # Claims of settlements you are allied to
  ally: AQUA
  # Claims of enemy settlements
  enemy: RED
  # Chunks that are not claimed
  unclaimed: GRAY
  # The chunk you are standing in
  current: YELLOW
symbol:
  # Normal chunk:
  normal: "-"
  # A plot that is for sale
  for-sale: "$"
  # A settlement member's plot
  plot: "p"
  # And embassy (plot that can be bought by players outside the settlement)
  embassy: "e"
  # The claim that contains the settlement home
  home: "H"
  # A settlement outpost
  outpost: "o"
  # An unclaimed chunk
  unclaimed: "-"
  # The chunk you are currently in (in the centre of the map)
  current: "+"