prefix: "<gray>[Settlements]</gray> "

command:
  warningtoggle:
    in-settlement: "{prefix}<red>You are a member of {state} {settlement}."
    enabled: "{prefix}<white>You will now receive close building warnings for {state} {settlement}."
    disabled: "{prefix}<white>Temporarily disabled close building warnings for {state} {settlement}."
  tax:
    info:
      - "<aqua><st>                                "
      - "<aqua>» <gold>{state} Tax: <yellow>${tax}"
      - "<aqua>» <gold>Total Plot Tax: <yellow>${plottax}"
      - "<aqua>» <gold>Plots Owned: <yellow>{plotamount}"
      - "<aqua>» <gold>Total Tax: <yellow>${totaltax}"
      - "<aqua>» <red>${totaltax} is deducted from your balance every upkeep"
      - "<aqua><st>                                "
    info-no-settlement:
      - "<aqua><st>                                "
      - "<aqua>» <gold>Plots Owned: <yellow>{plotamount}"
      - "<aqua>» <gold>Total Tax: <yellow>${totaltax}"
      - "<aqua>» <red>${totaltax} is deducted from your balance every upkeep"
      - "<aqua><st>                                "
  resident:
    claimtransfer:
      success: "{prefix}<white>Successfully transferred <gold>{amount}</gold> bonus claims to {targetstate} {target}."
      notify-settlement: "{prefix}<white>{name} <gray>transferred <gold>{amount}</gold> bonus claims to the settlement!"
      not-enough-bonus: "{prefix}<red>You don't have enough bonus claims to transfer to {targetstate} {target}! (<yellow>{claims}/{amount}</yellow>)"
    show:
      no-settlement:
        - "<aqua><st>                                "
        - "<aqua>» <yellow><bold>Resident {name}"
        - "<aqua>» <white>Settlement: <yellow>None"
        - "<aqua>» <white>Balance: <yellow>${balance}"
        - "<aqua>» <white>Tax: <yellow>${tax}"
        - "<aqua>» <white>Bonus claims: <yellow>{bonus}"
        - "<aqua>» <white>Join Date: <yellow>{joindate}"
        - "<aqua>» <white>Last Login: <yellow>{lastlogin}"
        - "<aqua><st>                                "
      settlement:
        - "<aqua><st>                                "
        - "<aqua>» <yellow><bold>Resident {name}"
        - "<aqua>» <white>Settlement: <yellow>{settlement}"
        - "<aqua>» <white>Rank: <yellow>{title}"
        - "<aqua>» <white>Balance: <yellow>${balance}"
        - "<aqua>» <white>Tax: <yellow>${tax}"
        - "<aqua>» <white>Missions: <yellow>{missionpoints}"
        - "<aqua>» <white>Bonus claims: <yellow>{bonus}"
        - "<aqua>» <white>Join Date: <yellow>{joindate}"
        - "<aqua>» <white>Last Login: <yellow>{lastlogin}"
        - "<aqua><st>                                "