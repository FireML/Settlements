prefix: "<gray>[Settlements]</gray> "

dialog:
  claiming:
    chunk-state:
      claimed-by-your-settlement:
        - "Claimed by your {ownerstate}"
        - ""
        - "Click to unclaim"
      claimed-by-ally: "Claimed by allied {ownerstate} {owner}"
      claimed-by-settlement: "Claimed by {ownerstate} {owner}"
      claimed-by-you:
        - "Your Plot"
        - ""
        - "Click to unclaim"
      claimed-plot: "{plotowner}'s Plot"
      unclaimed-plot:
        - "Unclaimed Plot"
        - ""
        - "Click to claim"
      unclaimed:
        - "Unclaimed Land"
        - ""
        - "Click to claim"

command:
  warningtoggle:
    in-settlement: "{prefix}<white>You are a member of {state} {settlement}."
    enabled: "{prefix}<white>You will now receive close building warnings for {state} {settlement}."
    disabled: "{prefix}<white>Temporarily disabled close building warnings for {state} {settlement}."
  tax:
    info:
      - "<aqua><st>                                "
      - "<aqua>» <gold>{state} Tax: <yellow>${tax}"
      - "<aqua>» <gold>Total Plot Tax: <yellow>${plottax}"
      - "<aqua>» <gold>Plots Owned: <yellow>{plotamount}"
      - "<aqua>» <gold>Total Tax: <yellow>${totaltax}"
      - "<aqua>» <red>${totaltax} is deducted from your balance every upkeep"
      - "<aqua><st>                                "
    info-no-settlement:
      - "<aqua><st>                                "
      - "<aqua>» <gold>Plots Owned: <yellow>{plotamount}"
      - "<aqua>» <gold>Total Tax: <yellow>${totaltax}"
      - "<aqua>» <red>${totaltax} is deducted from your balance every upkeep"
      - "<aqua><st>                                "
  resident:
    claimtransfer:
      success: "{prefix}<white>Successfully transferred <gold>{amount}</gold> bonus claims to {targetstate} {target}."
      notify-settlement: "{prefix}<white>{name} <gray>transferred <gold>{amount}</gold> bonus claims to the settlement!"
      not-enough-bonus: "{prefix}<white>You don't have enough bonus claims to transfer to {targetstate} {target}! (<yellow>{claims}/{amount}</yellow>)"
    show:
      title: "<yellow><bold>Resident {name}"
      no-settlement:
        - "<white>Settlement: <yellow>None"
        - "<white>Bonus claims: <yellow>{bonus}"
        - ""
        - "<white>Balance: <yellow>${balance}"
        - "<white>Tax: <yellow>${tax}"
        - ""
        - "<white>Join Date: <yellow>{joindate}"
        - "<white>Last Login: <yellow>{lastlogin}"
      settlement:
        - "<white>Settlement: <yellow>{settlementstate} {settlement}"
        - "<white>Rank: <yellow>N/A" # {title}
        - "<white>Missions: <yellow>{missionpoints}"
        - "<white>Bonus claims: <yellow>{bonus}"
        - ""
        - "<white>Balance: <yellow>${balance}"
        - "<white>Tax: <yellow>${tax}"
        - ""
        - "<white>Join Date: <yellow>{joindate}"
        - "<white>Last Login: <yellow>{lastlogin}"
  friend:
    add:
      already-friends: "{prefix}<white>You are already friends with <gold>{name}<white>!"
      already-sent-request: "{prefix}<white>You already sent a friend request to <gold>{name}<white>!"
      success: "{prefix}<white>Sent a friend request to <gold>{name}<white>!"
      received: "{prefix}<gold>{name}<white> wants to be your friend! Accept with <click:run_command:'/friend accept {name}'><gold><u>/friend accept {name}<white>."
    accept:
      no-request: "{prefix}<gold>{name} <white>has not sent you a friend request."
      success:
        target: "{prefix}<white>You are now friends with <gold>{name}<white>!"
        sender: "{prefix}<gold>{name}<white> accepted your friend request!"
    deny:
      no-request: "{prefix}<gold>{name} <white>has not sent you a friend request."
      success:
        target: "{prefix}<white>Denied friend request from <gold>{name}<white>!"
        sender: "{prefix}<gold>{name}<white> denied your friend request!"
    remove:
      not-friends: "{prefix}<white>You are not friends with <gold>{name}<white>."
      success: "{prefix}<white>You are no longer friends with <gold>{name}<white>."
      removed-request: "{prefix}<white>Cancelled friend request to <gold>{name}<white>."
  plot:
    mode:
      success: "{prefix}<white>Successfully set plot mode <gold>{mode} <white>to <gold>{value}<white>."
      inherit: "{prefix}<white>Plot mode <gold>{mode}<white> now inherits from parent <gold>{parent}<white>: <gold>{value}<white>."
      no-parent: "{prefix}<white>Plot mode <gold>{mode}<white> cannot be reset as it does not apply to parent <gold>{parent}<white>."
      embassy:
        success-no-sale: "{prefix}<white>Successfully set the plot to an <gold>embassy<white>!"
        success: "{prefix}<white>Successfully set the plot to an <gold>embassy<white> with price <gold>{value}<white>!"
    setname:
      success: "{prefix}<white>Set name of plot to <gold>{name}<white>!"
    setdescription:
      success: "{prefix}<white>Set description of plot to <gold>{description}<white>!"
    perms:
      success: "{prefix}<white>Successfully set state of plot flag <gold>{flag} <white>to <gold>{state}<white>."
      success-all: "{prefix}<white>Successfully set state of all plot flags to <gold>{state}<white>."
      inherit: "{prefix}<white>Plot state <gold>{flag}<white> now inherits from parent <gold>{parent}<white>: <gold>{value}<white>."
      inherit-all: "{prefix}<white>All plot flags now inherit from parent <gold>{parent}<white>."
    sale:
      current: "{prefix}<white>The current price of this land is: <gold>{price}<white>."
      already-owned: "{prefix}<white>This land is already owned."
      success: "{prefix} <green><b>SUCCESS</b> <white>This land has been put on sale for <gold>${price}<white>!"
      no-longer-for-sale: "{prefix} <green><b>SUCCESS</b> <white>This land is no longer for sale!"
    buy:
      tax-warning: "{prefix}<white>This plot is taxed at <gold>${tax}/day <white>. Type <click:run_command:'/plot buy'><u><gold>/plot buy</click> <white>again to confirm!"
      purchased: "{prefix}<white>Successfully purchased this land for <gold>${price}<white>."
    reset:
      success: "{prefix}<white>Successfully reset all permissions and modes in this plot."
    unown:
      success: "{prefix}<white>This plot is no longer owned by you!"
      success-other: "{prefix}<white>This plot is no longer owned by <gold>{owner}<white>!"
    tax:
      current: "{prefix}<white>This plot's tax is <gold>${tax}<white>!"
      set:
        success: "{prefix}<white>Daily tax of this plot was set to <gold>${amount}<white>!"
        already-owned: "{prefix}<white>You can only change the tax of unowned claims!"

# Error messages.
error:
  not-a-claim: "{prefix}<white>You are not currently standing in claimed land."
  not-your-settlement: "{prefix}<white>This is not your {state}!"
  not-your-plot: "{prefix}<white>This is not your plot!"
  not-for-sale: "{prefix}<white>This land is not for sale!"
  cant-buy-embassy: "{prefix}<white>You can't buy this plot as it is an embassy of your {state}!"
  cant-set-embassy: "{prefix}<white>You can't set an embassy here!"
  string-too-long: "{prefix}<gold>{input} <white>is too long. (<gold>{amount}<white>/<gold>{max}<white>} Characters)"
  not-enough-money: "{prefix}<white>You do not have enough money to pay <gold>{amount}<white>!"