prefix: "<gray>[Settlements]</gray> "

command:
  warningtoggle:
    enabled: "{prefix}<white>You will now receive close building warnings for {state} {settlement}."
    disabled: "{prefix}<white>Temporarily disabled close building warnings for {state} {settlement}."
  tax:
    info:
      - "<aqua><st>                "
      - "<gold>{state} Tax: <yellow>${tax}"
      - "<gold>Total Plot Tax: <yellow>${plottax}"
      - "<gold>Plots Owned: <yellow>{plotamount}"
      - "<gold>Total Tax: <yellow>${totaltax}"
      - "<aqua><st>                "
      - "<red>${totaltax} is deducted from your balance every upkeep"
    info-no-settlement:
      - "<aqua><st>                "
      - "<gold>Plots Owned: <yellow>{plotamount}"
      - "<gold>Total Tax: <yellow>${totaltax}"
      - "<aqua><st>                "
      - "<red>${totaltax} is deducted from your balance every upkeep"