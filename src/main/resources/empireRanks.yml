# Permissions that a user can toggle
perm-groups:
  general:
    icon: GRASS_BLOCK
    permissions:
    - empire.allies
    - empire.banished
    - empire.bank.history
    - empire.perms.show
  settings:
    icon: REDSTONE_BLOCK
    permissions:
    - empire.build
    - empire.mode
    - empire.perks
    - empire.perks.toggle
    - empire.setaccess
    - empire.settings
    - empire.use
  officer:
    icon: DIAMOND_SWORD
    permissions:
    - empire.ally
    - empire.banish
    - empire.bank.withdraw
    - empire.disband
    - empire.invite
    - empire.joinfee.set
    - empire.kick
    - empire.officer
    - empire.perms
    - empire.perms.set
    - empire.perms.unset
    - empire.regen
    - empire.rename
    - empire.setdescription
    - empire.sethome
    - empire.setrank
    - empire.setsymbol
    - empire.shop
    - empire.shop.repeat
    - empire.tax.set
    - empire.unally
    - empire.unbanish

