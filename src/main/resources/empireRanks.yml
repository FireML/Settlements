# Explanation: https://wiki.phoenix616.dev/plugin:empires:config:empireranks.yml

perm-groups:
  manage-member:
    permissions:
    - empire.member # TODO: Management GUI
    - empire.kicknotice # TODO
    - empire.setrank
    - empire.settitle
    - empire.settaxevasion # TODO
  manage-allies:
    permissions:
    - empire.allyclaim
    - empire.manageally # TODO
  admin-allies:
    permissions:
    - empire.ally
    - empire.unally
  manage-ranks:
    permissions:
    - empire.ranks
    - empire.ranks.perms.set
    - empire.ranks.perms.reset
  manage-settings:
    permissions:
    - empire.joinfee.set
    - empire.setaccess
    - empire.setdescription
    - empire.recruitement # TODO (NPC)
    - empire.build
    - empire.settings
    - empire.perms
    - empire.mode
    - empire.perks.toggle
  manage-notes:
    permissions:
    - empire.sethome
    - empire.discord.set
    - empire.rules.set # TODO
  manage-bank:
    permissions:
    - empire.bank.withdraw
    - empire.tax.set
    - empire.auctiontax.set # TODO
  use-bank:
    permissions:
    - empire.bank # TODO: GUI
    - empire.bank.storage # TODO: Add
    - empire.bank.history
  manage-shop:
    permissions:
    - empire.shop.unlock
    - empire.shop.repeat

# Permissions that a user can toggle
toggleable-permissions:
- empire.memberlist
- empire.group.manage-.member
- empire.kick
- empire.titles
- empire.group.use-bank
- empire.bank.deposit
- empire.group.manage-bank
- empire.allies
- empire.group.manage-ally
- empire.group.admin-allies
- empire.banished
- empire.banish
- empire.unbanish
- empire.group.manage-ranks
- empire.mail
- empire.group.manage-notes
- empire.group.manage-settings
- empire.history
- empire.rename
- empire.disband
- empire.rewards
- empire.transfer
- empire.claim
- empire.unclaim
- empire.plot.admin
- empire.portal.admin
- empire.group.manage-outpost
- empire.outpost.unclaim
- empire.invite
- empire.group.manage-shop
- empire.lock.admin
- empire.chestshop.admin
- empire.officer

# Ranks for people in an empire.
ranks:
  leader:
    icon: netherite_chestplate
    inherits: member
    permissions:
    - empire.group.manage-member
    - empire.group.manage-allies
    - empire.group.admin-allies
    - empire.group.manage-ranks
    - empire.group.manage-notes
    - empire.group.manage-settings
    - empire.group.manage-bank
    - empire.banish
    - empire.banished
    - empire.chestshop.admin
    - empire.help.leader
    - empire.disband
    - empire.regen
    - empire.rename
    - empire.setsymbol
    - empire.tax.action
    - empire.tax.exempt
    - empire.transfer
    - empire.unbanish
    - empire.help.senator
    - empire.invite
    - empire.kick
    - empire.lock.admin
    - empire.mail
    - empire.officer
    - empire.plot.admin
    # member permissions
    - empire.allies
    - empire.joinfee
    - empire.memberlist
    - empire.bank
    - empire.bank.balance
    - empire.bank.deposit
    - empire.help.member
    - empire.perks
    - empire.shop
    - empire.tax
    - empire.upkeep
  assistant:
    icon: diamond_sword
    inherits: member
    permissions:
    - empire.rename
    - empire.lock.admin
    - empire.help.assistant
    - empire.group.manage-allies
    - empire.group.admin-allies
    - empire.allies
    - empire.banished
    - empire.claim
    - empire.perks
    - empire.group.manage-ranks
    - empire.group.manage-notes
    - empire.group.manage-settings
    - empire.group.manage-bank
    - empire.plot.admin
    - empire.group.manage-member
    - empire.invite
    - empire.kick
    - empire.help.member
    - empire.help.senator
    - empire.officer
    - empire.help.recruiter
  senator:
    icon: golden_sword
    inherits: member
    permissions:
    - empire.help.senator
    - empire.invite
    - empire.kick
    - empire.officer
    - empire.group.manage-allies
    - empire.group.admin-allies
    - empire.help.recruiter
    - empire.help.member
    - empire.plot.admin
  recruiter:
    icon: iron_sword
    inherits: member
    permissions:
    - empire.invite
    - empire.kick
    - empire.help.recruiter
  member:
    icon: stone_sword
    permissions:
    - empire.allies
    - empire.joinfee
    - empire.memberlist
    - empire.group.use-bank
    - empire.bank.deposit
    - empire.deposit
    - empire.deposit.history
    - empire.help.member
    - empire.perks
    - empire.shop
    - empire.tax
    - empire.upgrade
    - empire.upkeep
