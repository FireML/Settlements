# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:events.yml

enabled: true
bossbar:
  format: "&b&l{title} &f{timeleft}"
  color: green
  style: segmented_10
# Run random event at these times:
automatic-events:
  # The events that should be automatic
  events:
  - mining
  - dirt
  - sand
  - gravel
  - wheat
  - beetroot
  - potato
  - carrots
  - chorus_flower
  - planted
  - saplings
  - overworld_hostile
  - overworld_neutral
  - nether_mobs
  - end_mobs
  times:
  - "1:00"
  - "3:00"
  - "5:00"
  - "7:00"
  - "9:00"
  - "11:00"
  - "13:00"
  - "15:00"
  - "17:00"
  - "19:00"
  - "21:00"
  - "23:00"
  timezone: UTC

        # PLACEHOLDERS WHEN USING COMMANDS FOR CONSOLE  
    # {claimer} - name of the player who claimed it
    # {claimerid} - UUID of player who claimed it
    # {village} - name of the village
    # {villageid} - internal id of the village
    # Following placeholders cause the commands to be run once for each online village resident:
    # {onlineresident} - name of the resident
    # {onlineresidentid} - UUID of the resident
    # Following placeholders cause the commands to be run once for each village resident:
    # {resident} - name of the resident
    # {residentid} - UUID of the resident
    # (These two placeholders can not be mixed)
rewards:
  first:
    name: "&bFirst Place!"
    icon: gold_ingot
    money: 750
    #items: bukkit items
    #- type: diamond
    #  amount: 3
    commands:
    - cc give p RareCrate 1 {onlineresident}
  second:
    name: "&bSecond Place!"
    icon: iron_ingot
    money: 500
    commands:
    - cc give p CommonCrate 1 {onlineresident}
  third:
    name: "&bThird Place!"
    icon: copper_ingot
    money: 250
    commands:
    - spawner giveshard {onlineresident} 1
  participation:
    name: "&bParticipation"
    icon: lapis_lazuli
    money: 7

    # Break Events
  # Blocks
events:
  mining:
    worlds: # To work in
    - Resource
    - Resource_Nether
    - Resource_the_end
    title: "Most Stone Broken - RESOURCE"
    time: 600 # Seconds
    rewards:
      '1':
      - first
      '2':
      - second
      '3':
      - third
      rest:
      - participation
    actions:
      break:
      - stone
