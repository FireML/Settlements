# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:npclevelconf.yml

settlement:
  manager:
    level-1:
      # Npc upkeep per level
      upkeep: 0
    level-2:
      requirements:
        STONE: 100
      perks:
        allies:
          unlockables:
          - allies
          - command.allyclaim
        mail:
          unlockables:
          - command.mail
    level-3:
      requirements:
        STONE: 100
        DIRT: 100
      perks:
        manager-command:
          unlockables:
          - command.settings
          - command.perms
          - command.build
          - command.access
          - command.privacy
          - command.setdescription
          - command.discord.set
          - command.joinfee.set
          - command.mode
          - command.ranks
          - command.setrank
          - command.setrecruitment
          - command.titles
    level-4:
      requirements:
        STONE: 100
        DIRT: 100
        DIAMOND: 100
      perks:
        npc-skin-command:
          unlockables:
          - command.npc.skin # TODO
  quarter-master:
    level-1: {}
    level-2:
      requirements:
        STONE: 100
      perks:
        upgrade-command:
          unlockables:
          - command.upgrade
  banker:
    level-1: {}
    level-2:
      requirements:
        STONE: 100
      perks:
        storage:
          unlockables:
          - storage
        bank-command:
          unlockables:
          - command.bank
          - command.tax.set
          - command.tax.action
          - command.auctiontax.set
    level-3:
      requirements:
        STONE: 100
        DIRT: 100
    level-4:
      requirements:
        STONE: 100
        DIRT: 100
        DIAMOND: 100
      perks:
        donations:
          unlockables:
          - command.donate
  elder:
    level-1:
      perks:
        recruitment:
          unlockables:
          - recruitment
    level-2:
      requirements:
        STONE: 100
      perks:
        recruitment-command:
          unlockables:
          - command.recruitment
          - command.missions
  traveling-merchant:
    level-1: {}
    level-2:
      requirements:
        STONE: 100
      perks:
        outpost-teleport-command:
          unlockables:
          - command.outpost.teleport
  black-market:
    level-1: {}
    level-2:
      requirements:
        STONE: 100
      perks:
        shop-command:
          unlockables:
          - command.shop
  auctioneer:
    level-1: {}
    level-2:
      upkeep: 100
      requirements:
        STONE: 100
      perks:
        auction-command:
          unlockables:
          - command.auction
  blacksmith:
    level-1: {}
    level-2:
      requirements:
        STONE: 100
      perks:
        refine-command:
          unlockables:
          - command.refine
