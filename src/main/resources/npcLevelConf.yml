# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:npclevelconf.yml

settlement:
  manager:
    level-1:
      # Npc upkeep per level
      upkeep: 0
      perks:
        allies:
          unlockables:
            - allies
            - command.allyclaim
        mail:
          unlockables:
            - command.mail
        manager-command:
          unlockables:
            - command.settings
            - command.perms
            - command.build
            - command.access
            - command.privacy
            - command.setdescription
            - command.discord.set
            - command.joinfee.set
            - command.mode
            - command.ranks
            - command.setrank
            - command.setrecruitment
            - command.titles
        npc-skin-command:
          unlockables:
            - command.npc.skin # TODO

  quarter-master:
    level-1:
      perks:
        upgrade-command:
          unlockables:
            - command.upgrade

  banker:
    level-1:
      perks:
        storage:
          unlockables:
            - storage
        bank-command:
          unlockables:
            - command.bank
            - command.tax.set
            - command.tax.action
            - command.auctiontax.set
        donations:
          unlockables:
            - command.donate

  elder:
    level-1:
      perks:
        recruitment:
          unlockables:
          - recruitment
        missions:
          unlockables:
          - missions
        recruitment-command:
          unlockables:
            - command.recruitment
            - command.missions

  traveling-merchant:
    level-1:
      perks:
        outpost-teleport-command:
          unlockables:
            - command.outpost.teleport

  black-market:
    level-1:
      perks:
        shop-command:
          unlockables:
            - command.shop

  auctioneer:
    level-1: {}

  blacksmith:
    level-1: {}

