# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:settlementranks.yml

perm-groups:
  manage-res:
    permissions:
    - settlement.res
    - settlement.active
    - settlement.kicknotice
    - settlement.setrank
    - settlement.settitle
    - settlement.settaxevasion
    - settlement.settaxexempt
  manage-allies:
    permissions:
    - settlement.allyclaim
    - settlement.manageally
  admin-allies:
    permissions:
    - settlement.ally
    - settlement.unally
  manage-ranks:
    permissions:
    - settlement.ranks
    - settlement.ranks.perms.set
    - settlement.ranks.perms.reset
  manage-settings:
    permissions:
    - settlement.joinfee.set
    - settlement.setaccess
    - settlement.setdescription
    - settlement.recruitment
    - settlement.build
    - settlement.settings
    - settlement.perms
    - settlement.mode
    - settlement.perks.toggle
    - settlement.npc
    - settlement.npc.skin
  manage-notes:
    permissions:
    - settlement.sethome
    - settlement.discord.set
    - settlement.rules.set
  manage-bank:
    permissions:
    - settlement.bank.withdraw
    - settlement.tax.set
    - settlement.tax.action
    - settlement.auctiontax.set
  use-bank:
    permissions:
    - settlement.bank
    - settlement.bank.storage # TODO: Add
    - settlement.bank.history
  use-outpost:
    permissions:
    - settlement.outpost.help
    - settlement.outpost.list
    - settlement.outpost.teleport
  manage-outpost:
    permissions:
    - settlement.outpost.help.elder
    - settlement.outpost.claim
    - settlement.outpost.sethome
    - settlement.outpost.rename
  manage-shop:
    permissions:
    - settlement.shop.unlock
    - settlement.shop.repeat
  
# Permissions that a user can toggle
toggleable-permissions:
- settlement.reslist
- settlement.group.manage-res
- settlement.kick
- settlement.titles
- settlement.group.use-bank
- settlement.bank.deposit
- settlement.group.manage-bank
- settlement.allies
- settlement.group.manage-allies
- settlement.group.admin-allies
- settlement.banished
- settlement.banish
- settlement.unbanish
- settlement.group.manage-ranks
- settlement.mail
- settlement.group.manage-notes
- settlement.group.manage-settings
- settlement.npc.teleport
- settlement.history
- settlement.rename
- settlement.disband
- settlement.rewards
- settlement.transfer
- settlement.missions.redistribute
- settlement.claim
- settlement.unclaim
- settlement.plot.admin
- settlement.portal.admin
- settlement.group.manage-outpost
- settlement.outpost.unclaim
- settlement.invite
- settlement.group.manage-shop
- settlement.lock.admin
- settlement.chestshop.admin
- settlement.officer

# Ranks for people in a settlement.
ranks:
  chief:
    icon: netherite_chestplate
    permissions:
    - settlement.group.manage-res
    - settlement.kick
    - settlement.titles
    - settlement.group.manage-allies
    - settlement.group.admin-allies
    - settlement.banish
    - settlement.unbanish
    - settlement.group.manage-ranks
    - settlement.mail
    - settlement.group.manage-notes
    - settlement.group.manage-settings
    - settlement.group.manage-bank
    - settlement.bank.withdraw
    - settlement.group.manage-outpost
    - settlement.outpost.unclaim
    - settlement.invite
    - settlement.group.manage-shop
    # Extra:
    - settlement.npc.teleport
    - settlement.lock.admin
    - settlement.chestshop.admin
    - settlement.history
    - settlement.rename
    - settlement.disband
    - settlement.rewards
    - settlement.transfer
    - settlement.claim
    - settlement.unclaim
    - settlement.plot.admin
    - settlement.portal.admin
    - settlement.officer
    - settlement.missions.redistribute
    - settlement.npc
    
    # resident base perms
    - settlement.allies
    - settlement.reslist
    - settlement.banished
    - settlement.group.use-bank
    - settlement.bank.deposit
    - settlement.npc
    - settlement.rewards
  
    # non-toggleable
    - settlement.outpost.help.chief
    - settlement.help.chief
    - settlement.help.elder
    - settlement.help.assistant
    - settlement.help.recruiter
    - settlement.help.builder
    - settlement.tax.exempt
    - settlement.officer

    - empire.create
    - empire.join
    - empire.help.chief
    - empire.leave

  assistant:
    icon: diamond_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.group.manage-res
    - settlement.kick
    - settlement.titles
    - settlement.group.manage-allies
    - settlement.group.admin-allies
    - settlement.group.manage-banished
    - settlement.banish
    - settlement.npc.teleport
    - settlement.group.manage-ranks
    - settlement.group.manage-notes
    - settlement.group.manage-settings
    - settlement.group.manage-bank
    - settlement.group.manage-outpost
    - settlement.missions.redistribute
    - settlement.invite
    - settlement.lock.admin
    - settlement.rewards
    - settlement.npc
    
  elder:
    icon: iron_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.npc.teleport
    - settlement.group.manage-res
    - settlement.group.manage-allies
    - settlement.group.manage-settings
    - settlement.group.manage-outpost
    - settlement.missions.redistribute
    - settlement.invite
    - settlement.npc
    - settlement.rewards
    
  recruiter:
    icon: golden_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.invite
    - settlement.npc.teleport
    - settlement.help.recruiter
    - settlement.help.builder
    - settlement.rewards
    - settlement.npc
    
  builder:
    icon: iron_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.npc.teleport
    - settlement.help.builder
    - settlement.rewards
    - settlement.npc
  resident:
    icon: stone_sword
    permissions:
    - settlement.allies
    - settlement.reslist
    - settlement.banished
    - settlement.group.use-bank
    - settlement.bank.deposit
    - settlement.missions.redistribute
    - settlement.rewards
    - settlement.npc
  guest:
    icon: stone_shovel
    permissions:
    - settlement.rules
    - settlement.rules.accept
    - settlement.leave
    - settlement.npc
