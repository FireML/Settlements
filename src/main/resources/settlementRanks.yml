# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:settlementranks.yml

perm-groups:
  'manage.res':
    permissions:
    - settlement.res # TODO: Management GUI
    - settlement.active
    - settlement.kicknotice # TODO
    - settlement.setrank
    - settlement.settitle # TODO
    - settlement.settaxevasion # TODO
  'manage.allies':
    permissions:
    - settlement.allyclaim
    - settlement.manageally # TODO
  'admin.allies':
    permissions:
    - settlement.ally
    - settlement.unally
  'manage.ranks':
    permissions:
    - settlement.ranks
    - settlement.ranks.perms.set
    - settlement.ranks.perms.reset
  'manage.settings':
    permissions:
    - settlement.joinfee.set
    - settlement.setaccess
    - settlement.setdescription
    - settlement.recruitement # TODO (NPC)
    - settlement.build
    - settlement.settings
    - settlement.perms
    - settlement.mode
    - settlement.perks.toggle
  'manage.notes':
    permissions:
    - settlement.sethome
    - settlement.discord.set
    - settlement.rules.set # TODO
  'manage.bank':
    permissions:
    - settlement.bank.withdraw
    - settlement.tax.set
    - settlement.auctiontax.set # TODO
  'use.bank':
    permissions:
    - settlement.bank # TODO: GUI
    - settlement.bank.storage # TODO: Add
    - settlement.bank.history
  'use.outpost':
    permissions:
    - settlement.outpost.help
    - settlement.outpost.list
    - settlement.outpost.teleport # TODO: Add NPC for everywhere
  'manage.outpost':
    permissions:
    - settlement.outpost.help.elder
    - settlement.outpost.claim
    - settlement.outpost.sethome
    - settlement.outpost.rename
  'manage.shop':
    permissions:
    - settlement.shop.unlock
    - settlement.shop.repeat
  
# Permissions that a user can toggle
toggleable-permissions:
- settlement.reslist
- settlement.group.manage.res
- settlement.kick
- settlement.titles
- settlement.group.use.bank
- settlement.bank.deposit
- settlement.group.manage.bank
- settlement.allies
- settlement.group.manage.ally
- settlement.group.admin.allies
- settlement.banished
- settlement.banish
- settlement.unbanish
- settlement.group.manage.ranks
- settlement.mail
- settlement.group.manage.notes
- settlement.group.manage.settings
- settlement.history
- settlement.rename
- settlement.disband
- settlement.rewards
- settlement.transfer
- settlement.claim
- settlement.unclaim
- settlement.plot.admin
- settlement.portal.admin
- settlement.group.manage.outpost
- settlement.outpost.unclaim
- settlement.invite
- settlement.group.manage.shop
- settlement.lock.admin
- settlement.chestshop.admin
- settlement.officer

# Ranks for people in a settlement.
ranks:
  chief:
    icon: netherite_sword
    permissions:
    - settlement.group.manage.res
    - settlement.kick
    - settlement.titles
    - settlement.group.manage.ally
    - settlement.group.admin.allies
    - settlement.banish
    - settlement.unbanish
    - settlement.group.manage.ranks
    - settlement.mail
    - settlement.group.manage.notes
    - settlement.group.manage.settings
    - settlement.group.manage.bank
    - settlement.bank.withdraw
    - settlement.group.manage.outpost
    - settlement.outpost.unclaim
    - settlement.invite
    - settlement.group.manage.shop
    # Extra:
    - settlement.lock.admin
    - settlement.chestshop.admin
    - settlement.history
    - settlement.rename
    - settlement.disband
    - settlement.rewards
    - settlement.transfer
    - settlement.claim
    - settlement.unclaim
    - settlement.plot.admin
    - settlement.portal.admin
    - settlement.officer
    
    # resident base perms
    - settlement.allies
    - settlement.reslist
    - settlement.banished
    - settlement.group.use.bank
    - settlement.bank.deposit
  
    # non-toggleable
    - settlement.outpost.help.chief
    - settlement.help.chief
    - settlement.help.elder
    - settlement.help.assistant
    - settlement.help.recruiter
    - settlement.help.builder
    - settlement.tax.exempt
    - settlement.officer

    - empire.create
    - empire.join
    - empire.help.chief
    - empire.leave

  assistant:
    icon: diamond_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.group.manage.res
    - settlement.kick
    - settlement.titles
    - settlement.group.manage.ally
    - settlement.group.admin.allies
    - settlement.group.manage.banished
    - settlement.banish
    - settlement.group.manage.ranks
    - settlement.group.manage.notes
    - settlement.group.manage.settings
    - settlement.group.manage.bank
    - settlement.group.manage.outpost
    - settlement.invite
    - settlement.lock.admin
    
  elder:
    icon: iron_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.group.manage.res
    - settlement.group.manage.ally
    - settlement.group.manage.settings
    - settlement.group.manage.outpost
    - settlement.invite
    
  recruiter:
    icon: gold_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.invite
    - settlement.help.recruiter
    - settlement.help.builder
    
  builder:
    icon: iron_sword
    inherits: resident
    permissions:
    - settlement.officer
    - settlement.help.builder
  resident:
    icon: stone_sword
    permissions:
    - settlement.allies
    - settlement.reslist
    - settlement.banished
    - settlement.group.use.bank
    - settlement.bank.deposit
