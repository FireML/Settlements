# Explanation: https://wiki.phoenix616.dev/plugin:empires:config:empiremissions.yml

# stones:
#  # Specify the material of the GUI icon, will use the requirements list if not set
#  icon: stone
#  # Only count if action occurs in empire world (should be false when using turn_in)
#  in-empire-world: false
#  # Only count if action occurs on empire claim (should be false when using turn_in)
#  on-empire-claim: false
#  # How many mission points the empire receives when the missions was completed
#  mission-points: 1
#  # How many contribution points a empire receives for finishing those
#  contribution-points: 1
#  # The type of this mission. Available ones are:
#  # - turn_in: Deposit items into GUI
#  # - place: Place blocks
#  # - break: Break blocks
#  # - harvest: Harvest crops and certain other stuff like berry bushes, dropping an apple etc. depends on the requirements
#  # - kill: Kill certain monsters/animals
#  type: turn_in
#  requirements:
#    stone: 500

    # ----------------------------------------#
    #   All items are in alphabetical order   #
    # ----------------------------------------#

