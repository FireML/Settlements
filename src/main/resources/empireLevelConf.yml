# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:levelconf.yml

levels:
  level-1:
    # The amount an empire needs to pay per day
    upkeep: 1000
    # The base radius that an empire world will have at that level
    # Set to 0 or below to disable the empire world on that level
    world-radius: 0
    # Lower the member per plot upkeep
    upkeep-reduction: 20
    # The amount of missions available to member settlements per day
    missions: 3
    # Maximum members
    size: 5
  level-2:
    upkeep: 1000
    world-radius: 500
    upkeep-reduction: 30
    missions: 4
    size: 10
    requirements:
      missions: 10
      Cobblestone: 3500000000
  level-3:
    upkeep: 1000
    world-radius: 550
    upkeep-reduction: 40
    missions: 5
    size: 15
    requirements:
      Cobblestone: 3500000000
  level-4:
    upkeep: 1000
    world-radius: 605
    upkeep-reduction: 50
    missions: 6
    size: 20
    requirements:
      Cobblestone: 3500000000
  level-5:
    upkeep: 1000
    world-radius: 740
    upkeep-reduction: 60
    missions: 7
    size: -1 # only limited by max size in config.yml
    requirements:
      Cobblestone: 3500000000