- "nazi"
- "hitler"
- "n1gga"
- "n1gger"
- "nazi"
- "nigg3r"
- "nigg4h"
- "nigga"
- "niggah"
- "niggas"
- "niggaz"
- "nigger"
- "niggre"
- "niggers"