# Explanation: https://wiki.phoenix616.dev/plugin:settlements:config:settlementissions.yml

#name:
# icon: material name
# on-settlement-claim: true or false
#   ^^ should be false when using the type "turn_in"
# mission-points: #
# contribution-points: 1
# type: type of mission
# - turn_in requires Deposit items into GUI
# - place requires Placing blocks
# - break requires Breaking blocks
# - harvest requires Harvesting crops and certain other stuff like berry bushes, dropping an apple, etc. based on requirements
# - kill requires Killing certain monsters/animals
# requirements:
#   item: amount

    # ----------------------------------------#
    #   All items are in alphabetical order   #
    # ----------------------------------------#

